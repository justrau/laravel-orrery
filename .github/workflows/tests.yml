# The support matrix, one leg per job.
#
# CI has its own provisioning contract, because its service containers are
# disposable per job:
# - The job's database name is orrery_ci_<run id>_<job index> (the MariaDB
#   jobs end in _mariadb and _mariadb_lts). It is validated by the name rule
#   of bin/lib/testdb.php.
# - The job creates that database, its _mirror twin and the orrery_marker
#   endpoint marker with a new token, with the clients inside its service
#   containers (MySQL 8.4 and Postgres 18; MariaDB in the MariaDB jobs).
# - bin/matrix --ci then runs the leg in this checkout. It runs Composer with
#   the leg's resolution (COMPOSER_NO_BLOCKING=1 only for the Composer calls
#   of a lowest leg), and every PHPUnit run through
#   `bin/test <engine> --no-provision` with that name and token. The docker
#   group does not run here, because it needs the local orrery-testing project.
# - Every run uses the strict schema mode (bin/test --schema=fresh): each test
#   migrates and rolls back. bin/matrix --ci never runs the reuse mode.
# - The PHP 8.4 x Laravel 12 latest leg has four variants (mirror and table
#   prefix). One job for all of them takes too long, so each variant is its
#   own job (bin/matrix --variants). Each job runs everything that its
#   variant ran before, and the scripts and workbench groups as every leg
#   does.
# - Two jobs run the MariaDB leg: mariadb on the latest LTS release (12.3,
#   also the local test server), and mariadb-previous-lts on 11.8 with PHP
#   8.3 and Laravel 12. Only CI runs 11.8; that job sets
#   ORRERY_TEST_SERVER_VERSION=11.8 for the identity check of the harness.
# - timeout-minutes is sized for the current suite under --ci, which always
#   starts fresh: 240 for the variant jobs and the lowest legs, 180 for the
#   other legs. Every limit stays under GitHub's 6-hour job limit.

name: tests

# Nightly on main, and by hand with `gh workflow run tests.yml --ref <branch>`.
# The nightly run skips every leg when main has no commit from the last 24
# hours (the job recent). A push or a pull request runs quick.yml instead.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recent:
    name: main has a commit from the last 24 hours
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the last commit
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ] || [ -n "$(git log --since='24 hours ago' --format=%H -1)" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "No commit in the last 24 hours: the nightly matrix skips."
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi

  leg:
    needs: recent
    if: needs.recent.outputs.run == 'true'
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }}${{ matrix.variant && format(', {0}', matrix.variant) || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}

    strategy:
      fail-fast: false
      matrix:
        # variant: empty runs every variant of the leg (only same/none, except
        # on PHP 8.4 x Laravel 12); a label runs that variant alone.
        # variant_key: the variant in the artifact name ('/' is not allowed).
        include:
          - {php: '8.3', laravel: '12', dependencies: latest, variant: '', variant_key: '', timeout: 180}
          - {php: '8.3', laravel: '13', dependencies: latest, variant: '', variant_key: '', timeout: 180}
          - {php: '8.4', laravel: '12', dependencies: latest, variant: same/none, variant_key: -same-none, timeout: 240}
          - {php: '8.4', laravel: '12', dependencies: latest, variant: separate/none, variant_key: -separate-none, timeout: 240}
          - {php: '8.4', laravel: '12', dependencies: latest, variant: same/prefix, variant_key: -same-prefix, timeout: 240}
          - {php: '8.4', laravel: '12', dependencies: latest, variant: separate/prefix, variant_key: -separate-prefix, timeout: 240}
          - {php: '8.4', laravel: '13', dependencies: latest, variant: '', variant_key: '', timeout: 180}
          - {php: '8.5', laravel: '12', dependencies: latest, variant: '', variant_key: '', timeout: 180}
          - {php: '8.5', laravel: '13', dependencies: latest, variant: '', variant_key: '', timeout: 180}
          - {php: '8.3', laravel: '12', dependencies: lowest, variant: '', variant_key: '', timeout: 240}
          - {php: '8.3', laravel: '13', dependencies: lowest, variant: '', variant_key: '', timeout: 240}

    services:
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: orrery
        ports:
          - 33106:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=orrery --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: orrery
        ports:
          - 54336:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=postgres --dbname=postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    env:
      PHP_VERSION: ${{ matrix.php }}
      LARAVEL_MAJOR: ${{ matrix.laravel }}
      DEPENDENCIES: ${{ matrix.dependencies }}
      VARIANT: ${{ matrix.variant }}
      # job-index is unique among the jobs of this run, also after the split
      # of the variant leg.
      ORRERY_TEST_DATABASE: orrery_ci_${{ github.run_id }}_${{ strategy.job-index }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, pdo_mysql, pdo_pgsql, pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Provision the databases and the endpoint markers
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          base=$ORRERY_TEST_DATABASE
          php -n bin/lib/testdb.php validate-name "$base"
          token=$(php -n -r 'echo bin2hex(random_bytes(16));')

          docker exec --env MYSQL_PWD=orrery "$MYSQL_CONTAINER" mysql --user=root --execute "
            CREATE DATABASE \`${base}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE \`${base}_mirror\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE orrery_marker;
            CREATE TABLE orrery_marker.marker (token VARCHAR(64) NOT NULL PRIMARY KEY);
            INSERT INTO orrery_marker.marker (token) VALUES ('${token}');"

          docker exec "$POSTGRES_CONTAINER" psql --username=postgres --dbname=postgres --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE \"${base}\"" \
            --command="CREATE DATABASE \"${base}_mirror\"" \
            --command="CREATE DATABASE orrery_marker" \
            --command="COMMENT ON DATABASE orrery_marker IS '${token}'" \
            --command='\connect orrery_marker' \
            --command="CREATE TABLE marker (token varchar(64) NOT NULL PRIMARY KEY)" \
            --command="INSERT INTO marker (token) VALUES ('${token}')"

          echo "ORRERY_TEST_TOKEN=${token}" >>"$GITHUB_ENV"

      - name: Run the leg
        run: |
          set -euo pipefail
          if [ "$DEPENDENCIES" = lowest ]; then
            selection=--no-latest
          else
            selection=--no-lowest
          fi
          variants=()
          if [ -n "$VARIANT" ]; then
            variants=("--variants=${VARIANT}")
          fi
          bin/matrix --ci --run-id=ci \
            "--php=${PHP_VERSION}" "--laravel=${LARAVEL_MAJOR}" "$selection" ${variants[@]+"${variants[@]}"} \
            "--php-binary=${PHP_VERSION}=$(command -v php)" \
            "--composer=$(command -v composer)"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}${{ matrix.variant_key }}
          path: .matrix/ci/
          if-no-files-found: warn

  # The MariaDB leg (MARIADB_LEGS of bin/lib/matrix.php): the latest PHP and
  # Laravel on the latest MariaDB LTS release, the image pinned by its
  # digest. bin/matrix --ci runs MariaDB only when --db names it, so the
  # legs above need no MariaDB service. The leg also runs its file SQLite
  # runs and the scripts group, as every leg does. The job
  # mariadb-previous-lts below runs the same on MariaDB 11.8.
  mariadb:
    needs: recent
    if: needs.recent.outputs.run == 'true'
    name: PHP 8.5, Laravel 13, latest, MariaDB
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:12.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
        env:
          MARIADB_ROOT_PASSWORD: orrery
        ports:
          - 33108:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=orrery --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    env:
      ORRERY_TEST_DATABASE: orrery_ci_${{ github.run_id }}_mariadb

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, pdo_mysql, pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Provision the databases and the endpoint marker
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          base=$ORRERY_TEST_DATABASE
          php -n bin/lib/testdb.php validate-name "$base"
          token=$(php -n -r 'echo bin2hex(random_bytes(16));')

          docker exec --env MYSQL_PWD=orrery "$MARIADB_CONTAINER" mariadb --user=root --execute "
            CREATE DATABASE \`${base}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE \`${base}_mirror\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE orrery_marker;
            CREATE TABLE orrery_marker.marker (token VARCHAR(64) NOT NULL PRIMARY KEY);
            INSERT INTO orrery_marker.marker (token) VALUES ('${token}');"

          echo "ORRERY_TEST_TOKEN=${token}" >>"$GITHUB_ENV"

      - name: Run the leg
        run: |
          set -euo pipefail
          bin/matrix --ci --run-id=ci --php=8.5 --laravel=13 --no-lowest --db=mariadb \
            "--php-binary=8.5=$(command -v php)" \
            "--composer=$(command -v composer)"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-php8.5-laravel13-latest-mariadb
          path: .matrix/ci/
          if-no-files-found: warn

  # The previous MariaDB LTS release: the stack of the first production host
  # (PHP 8.3, Laravel 12) on MariaDB 11.8, the image pinned by its digest.
  # Only CI runs this release; docker/testing/compose.yaml and bin/matrix
  # without --ci have no 11.8 server. ORRERY_TEST_SERVER_VERSION makes the
  # identity check of the harness expect 11.8 instead of the default 12.3.
  mariadb-previous-lts:
    needs: recent
    if: needs.recent.outputs.run == 'true'
    name: PHP 8.3, Laravel 12, latest, MariaDB 11.8
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    services:
      mariadb:
        image: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
        env:
          MARIADB_ROOT_PASSWORD: orrery
        ports:
          - 33108:3306
        options: >-
          --health-cmd "mariadb-admin ping --host=127.0.0.1 --user=root --password=orrery --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s

    env:
      ORRERY_TEST_DATABASE: orrery_ci_${{ github.run_id }}_mariadb_lts
      ORRERY_TEST_SERVER_VERSION: '11.8'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, pdo_mysql, pdo_sqlite, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Provision the databases and the endpoint marker
        env:
          MARIADB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          set -euo pipefail
          base=$ORRERY_TEST_DATABASE
          php -n bin/lib/testdb.php validate-name "$base"
          token=$(php -n -r 'echo bin2hex(random_bytes(16));')

          docker exec --env MYSQL_PWD=orrery "$MARIADB_CONTAINER" mariadb --user=root --execute "
            CREATE DATABASE \`${base}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE \`${base}_mirror\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE orrery_marker;
            CREATE TABLE orrery_marker.marker (token VARCHAR(64) NOT NULL PRIMARY KEY);
            INSERT INTO orrery_marker.marker (token) VALUES ('${token}');"

          echo "ORRERY_TEST_TOKEN=${token}" >>"$GITHUB_ENV"

      - name: Run the leg
        run: |
          set -euo pipefail
          bin/matrix --ci --run-id=ci --php=8.3 --laravel=12 --no-lowest --db=mariadb \
            "--php-binary=8.3=$(command -v php)" \
            "--composer=$(command -v composer)"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-php8.3-laravel12-latest-mariadb11.8
          path: .matrix/ci/
          if-no-files-found: warn
