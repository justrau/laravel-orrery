# Reproducible assets: pnpm install, the JavaScript unit tests, the
# build, and the check that the build reproduces the committed dist/. The
# Node version comes from .nvmrc, the pnpm version from "packageManager" in
# package.json. Every action is pinned by its commit, with the version as a
# comment.

name: assets

# Manual only: start it with `gh workflow run assets.yml --ref <branch>`.
# A push or a pull request does not start it, to save Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: dist/ is reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --engine-strict

      - name: Unit tests
        run: pnpm test

      - name: Build and compare
        run: bin/check-assets
