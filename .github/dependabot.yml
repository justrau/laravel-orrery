# Dependabot updates only the GitHub Actions, weekly. The workflows pin each
# action to a commit SHA with its release in a comment; Dependabot updates
# both. The cooldown waits until a release is a week old. Composer and npm
# stay manual.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
